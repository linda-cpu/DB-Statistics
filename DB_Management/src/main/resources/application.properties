#spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST:localhost} 
#local

spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT:27017} 
spring.data.mongodb.database=station_db
spring.data.mongodb.username=root
spring.data.mongodb.password=handke
spring.data.mongodb.authentication-database=handke
# Use the URI to bundle everything. 
